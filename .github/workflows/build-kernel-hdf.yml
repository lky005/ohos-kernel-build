name: Build OHOS x86_64 Kernel 6.6 with HDF

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/graalvm /opt/ghc \
            /usr/local/share/boost /usr/local/lib/android /usr/share/swift \
            /usr/local/.ghcup /usr/share/miniconda /usr/local/share/chromium \
            /usr/local/share/powershell /opt/hostedtoolcache
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev \
            bc dwarves cpio lz4 zstd gcc make python3 git curl

      - name: Checkout workflow repo
        uses: actions/checkout@v4

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch OpenHarmony_debug_20240815 \
            https://github.com/vindaus/openharmony-kernel_linux_6.6 kernel
          du -sh kernel/

      - name: Clone HDF repos
        run: |
          git clone --depth=1 https://github.com/openharmony/drivers_adapter_khdf_linux hdf_adapter
          git clone --depth=1 https://github.com/openharmony/drivers_hdf_core hdf_core
          du -sh hdf_adapter/ hdf_core/

      - name: Apply HDF patch
        run: |
          chmod +x scripts/apply-hdf.sh
          bash scripts/apply-hdf.sh "$GITHUB_WORKSPACE/kernel" "$GITHUB_WORKSPACE/hdf_adapter" "$GITHUB_WORKSPACE/hdf_core"

      - name: Generate config
        working-directory: kernel
        run: |
          make ARCH=x86 x86_64_defconfig

          cat >> .config << 'EOF'
          CONFIG_DRIVERS_HDF=y
          CONFIG_HDF_SUPPORT_LEVEL=2
          CONFIG_DRIVERS_HDF_PLATFORM=y
          CONFIG_DRIVERS_HDF_PLATFORM_GPIO=y
          CONFIG_DRIVERS_HDF_PLATFORM_I2C=y
          CONFIG_DRIVERS_HDF_PLATFORM_UART=y
          CONFIG_DRIVERS_HDF_PLATFORM_SPI=y
          CONFIG_HILOG=y
          CONFIG_HIEVENT=y
          CONFIG_ACCESS_TOKENID=y
          CONFIG_HMDFS_FS=y
          CONFIG_HMDFS_FS_PERMISSION=y
          CONFIG_HYPERHOLD=y
          CONFIG_ASHMEM=y
          CONFIG_TLS=y
          CONFIG_UNIX_SCM=y
          CONFIG_STREAM_PARSER=y
          CONFIG_NET_SOCK_MSG=y
          CONFIG_BLK_DEV_INITRD=y
          CONFIG_BLK_DEV_RAM=y
          CONFIG_BLK_DEV_RAM_SIZE=65536
          CONFIG_DRM=y
          CONFIG_DRM_I915=y
          CONFIG_DRM_AMDGPU=y
          CONFIG_DRM_RADEON=y
          CONFIG_DRM_NOUVEAU=y
          CONFIG_DRM_VIRTIO_GPU=y
          CONFIG_USB=y
          CONFIG_USB_XHCI_HCD=y
          CONFIG_USB_XHCI_PCI=y
          CONFIG_USB_EHCI_HCD=y
          CONFIG_USB_STORAGE=y
          CONFIG_USB_HID=y
          CONFIG_NVME_CORE=y
          CONFIG_BLK_DEV_NVME=y
          CONFIG_ATA=y
          CONFIG_ATA_PIIX=y
          CONFIG_SATA_AHCI=y
          CONFIG_NETDEVICES=y
          CONFIG_ETHERNET=y
          CONFIG_NET_VENDOR_INTEL=y
          CONFIG_E1000E=y
          CONFIG_IGB=y
          CONFIG_NET_VENDOR_REALTEK=y
          CONFIG_R8169=y
          CONFIG_IWLWIFI=y
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_BT=y
          CONFIG_BTUSB=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_SOUND=y
          CONFIG_SND=y
          CONFIG_SND_HDA_INTEL=y
          CONFIG_SND_HDA_CODEC_HDMI=y
          CONFIG_SND_USB_AUDIO=y
          CONFIG_EXT4_FS=y
          CONFIG_F2FS_FS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_FUSE_FS=y
          CONFIG_CONFIGFS_FS=y
          CONFIG_SECURITY=y
          CONFIG_SECURITY_SELINUX=y
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CPUSETS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_MEMCG=y
          CONFIG_NET=y
          CONFIG_PROC_FS=y
          CONFIG_SYSFS=y
          CONFIG_TMPFS=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          EOF

          make ARCH=x86 olddefconfig

          echo "=== HDF in final config ==="
          grep "DRIVERS_HDF" .config || echo "WARNING: HDF dropped by olddefconfig!"

      - name: Build kernel
        working-directory: kernel
        run: |
          echo "CPU: $(nproc), RAM: $(free -h | grep Mem | awk '{print $2}')"
          set -o pipefail
          make ARCH=x86 -j$(nproc) EXTRA_CFLAGS="-Wno-error" bzImage 2>&1
          ls -lh arch/x86/boot/bzImage
          file arch/x86/boot/bzImage

      - name: Verify HDF compilation
        working-directory: kernel
        run: |
          set +e
          echo "=== HDF object files ==="
          find . -name "*.o" -path "*/hdf/*" 2>/dev/null | wc -l
          echo "HDF .o files compiled"
          find . -name "*.o" -path "*/hdf/*" 2>/dev/null | head -10
          echo "=== Kernel info ==="
          file arch/x86/boot/bzImage
          exit 0

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: ohos-kernel-x86_64-6.6-hdf
          path: kernel/arch/x86/boot/bzImage
          retention-days: 30
          if-no-files-found: error
