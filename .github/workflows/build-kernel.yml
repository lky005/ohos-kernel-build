name: Build OHOS x86_64 Kernel 6.6

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: 'Kernel source repo URL'
        required: false
        default: 'https://github.com/vindaus/openharmony-kernel_linux_6.6'
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: 'OpenHarmony_debug_20240815'

env:
  KERNEL_REPO: ${{ github.event.inputs.kernel_repo || 'https://github.com/vindaus/openharmony-kernel_linux_6.6' }}
  KERNEL_BRANCH: ${{ github.event.inputs.kernel_branch || 'OpenHarmony_debug_20240815' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # 5 hours max

    steps:
      - name: Free up disk space
        run: |
          echo "=== Before cleanup ==="
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/graalvm /opt/ghc \
            /usr/local/share/boost /usr/local/lib/android /usr/share/swift \
            /usr/local/.ghcup /usr/share/miniconda /usr/local/share/chromium \
            /usr/local/share/powershell /opt/hostedtoolcache
          echo "=== After cleanup ==="
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential flex bison libssl-dev libelf-dev \
            bc dwarves cpio lz4 zstd \
            gcc make python3

      - name: Checkout kernel source
        run: |
          echo "Cloning $KERNEL_REPO branch $KERNEL_BRANCH ..."
          git clone --depth=1 --branch "$KERNEL_BRANCH" "$KERNEL_REPO" kernel
          echo "=== Repo size ==="
          du -sh kernel/

      - name: Generate x86_64 base config
        working-directory: kernel
        run: |
          make ARCH=x86 x86_64_defconfig
          echo "=== Base config generated ==="

      - name: Apply OHOS x86_64 config overlay
        working-directory: kernel
        run: |
          cat >> .config << 'OHOS_EOF'

          # ======== OHOS/OpenHarmony 必要配置 ========

          # HDF 驱动框架 (Hardware Driver Foundation)
          CONFIG_DRIVERS_HDF=y
          CONFIG_HDF_SUPPORT_LEVEL=2
          CONFIG_DRIVERS_HDF_PLATFORM=y
          CONFIG_DRIVERS_HDF_PLATFORM_GPIO=y
          CONFIG_DRIVERS_HDF_PLATFORM_I2C=y
          CONFIG_DRIVERS_HDF_PLATFORM_UART=y
          CONFIG_DRIVERS_HDF_PLATFORM_SPI=y

          # DFX: hilog / hievent 日志
          CONFIG_HILOG=y
          CONFIG_HIEVENT=y

          # Access Token
          CONFIG_ACCESS_TOKENID=y

          # HMDFS 分布式文件系统
          CONFIG_HMDFS_FS=y
          CONFIG_HMDFS_FS_PERMISSION=y

          # Hyperhold 内存管理
          CONFIG_HYPERHOLD=y

          # Ashmem (foundation 依赖)
          CONFIG_ASHMEM=y

          # 网络/IPC
          CONFIG_TLS=y
          CONFIG_UNIX_SCM=y
          CONFIG_STREAM_PARSER=y
          CONFIG_NET_SOCK_MSG=y

          # Initrd 支持
          CONFIG_BLK_DEV_INITRD=y
          CONFIG_BLK_DEV_RAM=y
          CONFIG_BLK_DEV_RAM_SIZE=65536

          # ======== GPU 驱动 (built-in) ========
          CONFIG_DRM=y
          CONFIG_DRM_I915=y
          CONFIG_DRM_AMDGPU=y
          CONFIG_DRM_RADEON=y
          CONFIG_DRM_NOUVEAU=y
          CONFIG_DRM_VIRTIO_GPU=y

          # ======== USB 驱动 ========
          CONFIG_USB=y
          CONFIG_USB_XHCI_HCD=y
          CONFIG_USB_XHCI_PCI=y
          CONFIG_USB_EHCI_HCD=y
          CONFIG_USB_STORAGE=y
          CONFIG_USB_HID=y

          # ======== 存储驱动 ========
          CONFIG_NVME_CORE=y
          CONFIG_BLK_DEV_NVME=y
          CONFIG_ATA=y
          CONFIG_ATA_PIIX=y
          CONFIG_SATA_AHCI=y

          # ======== 网络驱动 ========
          CONFIG_NETDEVICES=y
          CONFIG_ETHERNET=y
          CONFIG_NET_VENDOR_INTEL=y
          CONFIG_E1000E=y
          CONFIG_IGB=y
          CONFIG_NET_VENDOR_REALTEK=y
          CONFIG_R8169=y
          CONFIG_IWLWIFI=y
          CONFIG_WLAN=y
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y

          # ======== 蓝牙 ========
          CONFIG_BT=y
          CONFIG_BTUSB=y
          CONFIG_BT_HCIBTUSB=y

          # ======== 声卡 ========
          CONFIG_SOUND=y
          CONFIG_SND=y
          CONFIG_SND_HDA_INTEL=y
          CONFIG_SND_HDA_CODEC_HDMI=y
          CONFIG_SND_USB_AUDIO=y

          # ======== 文件系统 ========
          CONFIG_EXT4_FS=y
          CONFIG_F2FS_FS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_FUSE_FS=y

          # ======== 安全 ========
          CONFIG_SECURITY=y
          CONFIG_SECURITY_SELINUX=y

          # ======== Cgroup ========
          CONFIG_CGROUPS=y
          CONFIG_CGROUP_FREEZER=y
          CONFIG_CGROUP_DEVICE=y
          CONFIG_CPUSETS=y
          CONFIG_CGROUP_CPUACCT=y
          CONFIG_MEMCG=y

          # ======== 其他 OHOS 需要 ========
          CONFIG_NET=y
          CONFIG_PROC_FS=y
          CONFIG_SYSFS=y
          CONFIG_TMPFS=y
          CONFIG_DEVTMPFS=y
          CONFIG_DEVTMPFS_MOUNT=y
          OHOS_EOF

          # 合并配置 (olddefconfig 解决依赖)
          make ARCH=x86 olddefconfig

          echo "=== Final config summary ==="
          grep -c "=y" .config
          echo "built-in options"
          grep -c "=m" .config
          echo "module options"

      - name: Build kernel
        working-directory: kernel
        run: |
          echo "=== Starting kernel build ==="
          echo "CPU: $(nproc) cores"
          echo "RAM: $(free -h | grep Mem | awk '{print $2}')"

          set -o pipefail
          make ARCH=x86 -j$(nproc) EXTRA_CFLAGS="-Wno-error" bzImage 2>&1

          echo "=== Build result ==="
          ls -lh arch/x86/boot/bzImage
          file arch/x86/boot/bzImage

      - name: Verify kernel
        working-directory: kernel
        run: |
          BZ=arch/x86/boot/bzImage
          echo "=== Kernel info ==="
          file "$BZ"
          echo "Size: $(stat -c%s "$BZ") bytes"
          strings "$BZ" | grep "Linux version"
          echo ""
          echo "=== OHOS feature check ==="
          for feat in BEGET ohos.required_mount HDF hilog accesstokenid; do
            cnt=$(strings "$BZ" | grep -ci "$feat" || true)
            echo "$feat: $cnt matches"
          done
          echo ""
          echo "=== Driver check ==="
          for drv in i915 amdgpu nouveau xhci nvme e1000e r8169; do
            cnt=$(strings "$BZ" | grep -ci "$drv" || true)
            echo "$drv: $cnt matches"
          done

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: ohos-kernel-x86_64-6.6
          path: kernel/arch/x86/boot/bzImage
          retention-days: 30
          if-no-files-found: error

      - name: Upload config
        uses: actions/upload-artifact@v4
        with:
          name: kernel-config
          path: kernel/.config
          retention-days: 30
